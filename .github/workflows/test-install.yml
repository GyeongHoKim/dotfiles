# Runners are headless. Every job uses chezmoi --override-data '{"dotfiles_profile":"server"}'
# and tests/verify_install.sh with DOTFILES_PROFILE=server (no desktop/GUI assertions).
name: Test Dotfiles Installation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fedora:
    name: Fedora (server profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker build -f tests/docker/Dockerfile.fedora -t dotfiles-test-fedora .
          docker run --rm dotfiles-test-fedora

  test-ubuntu:
    name: Ubuntu ${{ matrix.ubuntu_version }} (server profile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26.04 ships sudo-rs as the default sudo; keep it covered so the
        # Ansible become incompatibility cannot regress unnoticed.
        ubuntu_version: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker build -f tests/docker/Dockerfile.ubuntu \
            --build-arg UBUNTU_VERSION=${{ matrix.ubuntu_version }} \
            -t dotfiles-test-ubuntu-${{ matrix.ubuntu_version }} .
          docker run --rm dotfiles-test-ubuntu-${{ matrix.ubuntu_version }}

  test-debian:
    name: Debian (server profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker build -f tests/docker/Dockerfile.debian -t dotfiles-test-debian .
          docker run --rm dotfiles-test-debian

  test-macos:
    name: macOS (server profile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi and apply dotfiles (server profile)
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          chezmoi init --apply --source "$GITHUB_WORKSPACE" --override-data '{"dotfiles_profile":"server"}'
      - name: Run verification
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          export DOTFILES_PROFILE=server
          chmod +x tests/verify_install.sh
          ./tests/verify_install.sh

  test-windows:
    # GitHub-hosted x64 Windows runners are Windows Server, so only the
    # server profile (no GUI winget packages) is exercised here.
    name: Windows Server (server profile)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install chezmoi
        run: |
          $dest = Join-Path $env:USERPROFILE "bin"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          & ([scriptblock]::Create((irm 'https://get.chezmoi.io/ps1'))) -b $dest
          $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Apply dotfiles (server profile)
        timeout-minutes: 60
        run: |
          chezmoi init --apply --source $env:GITHUB_WORKSPACE --override-data '{"dotfiles_profile":"server"}'
      - name: Run verification
        env:
          DOTFILES_PROFILE: server
        run: ./tests/verify_install.ps1
