# Runners are headless. Every job uses chezmoi --override-data '{"dotfiles_profile":"server"}'
# and tests/verify_install.sh with DOTFILES_PROFILE=server (no desktop/GUI assertions).
name: Test Dotfiles Installation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  test-fedora:
    name: Fedora (server profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build -f tests/docker/Dockerfile.fedora -t dotfiles-test-fedora .
          docker run --rm dotfiles-test-fedora

  test-ubuntu:
    name: Ubuntu (server profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build -f tests/docker/Dockerfile.ubuntu -t dotfiles-test-ubuntu .
          docker run --rm dotfiles-test-ubuntu

  test-debian:
    name: Debian (server profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build -f tests/docker/Dockerfile.debian -t dotfiles-test-debian .
          docker run --rm dotfiles-test-debian

  test-macos:
    name: macOS (server profile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi and apply dotfiles (server profile)
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          chezmoi init --apply --source "$GITHUB_WORKSPACE" --override-data '{"dotfiles_profile":"server"}'
      - name: Run verification
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          export DOTFILES_PROFILE=server
          chmod +x tests/verify_install.sh
          ./tests/verify_install.sh
